<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vulkanschmiede · Glühende Werkstatt</title>
<style>
:root{--bg:#140a08;--panel:rgba(34,16,12,.9);--panel2:#2a120c;--line:rgba(255,140,40,.55);--accent:#ff8a2a;--accent2:#e8381c;--gold:#ffd36a;--ink:#fff1e0;--btn-ink:#2a0e04;--font:'Trebuchet MS','Segoe UI',system-ui,sans-serif;--radius:10px;--bw:2px;--shadow:0 0 16px rgba(255,100,20,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.brand{display:flex;gap:8px;align-items:center;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:6px 12px 6px 8px;box-shadow:var(--shadow)}
.brand i{font-style:normal;font-size:24px}
.brand b{display:block;font-size:15px;line-height:1.05;letter-spacing:.02em}
.brand small{display:block;font-size:10px;letter-spacing:.14em;opacity:.7;font-weight:800}
.wallet{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;gap:7px;align-items:center;background:var(--panel);border:var(--bw) solid var(--line);border-radius:999px;padding:6px 13px;font-weight:900;box-shadow:var(--shadow)}
.pill.money{color:var(--gold);font-size:19px}
.pill.pocket{font-size:14px;padding:4px 6px 4px 12px}
.pill em{font-style:normal;background:var(--accent2);color:var(--btn-ink);border-radius:999px;padding:1px 7px;font-size:11px}
.pill button{width:30px;height:30px;border-radius:50%;border:0;background:var(--accent);color:var(--btn-ink);font-weight:900;font-size:16px}
.card{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
#quest{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 66px);width:min(300px,calc(100vw - 150px));padding:7px 10px;display:flex;gap:9px;align-items:center;pointer-events:none}
#quest .qi{font-size:22px;width:30px;text-align:center}
#quest small{display:block;font-size:9px;letter-spacing:.14em;color:var(--accent);font-weight:900}
#quest b{display:block;font-size:14px;line-height:1.15}
#quest span.qd{display:block;font-size:11px;opacity:.75;line-height:1.2}
#quest .qdist{margin-left:auto;font-weight:900;font-size:12px;color:var(--gold);white-space:nowrap}
#drawer{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 112px);width:240px;padding:12px 14px;font-size:13px}
#drawer p{margin:5px 0;display:flex;justify-content:space-between;gap:8px}
#drawer h3{margin:0 0 6px;display:flex;justify-content:space-between;font-size:15px}
#drawer .bar{height:8px;border-radius:6px;background:rgba(128,128,128,.25);overflow:hidden;margin:4px 0 8px}
#drawer .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0}
#drawer button,.mbtn{margin-top:8px;width:100%;padding:8px;border-radius:12px;border:var(--bw) solid var(--line);background:rgba(128,128,128,.18);font-weight:800}
.tools{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tools button{background:var(--panel);border:var(--bw) solid var(--line);border-radius:14px;padding:8px 14px;font-weight:900;min-width:46px;box-shadow:var(--shadow)}
#rush{background:linear-gradient(135deg,var(--accent2),var(--gold))!important;color:var(--btn-ink);border:0!important;position:relative;overflow:hidden;min-width:92px;height:46px}
#rush i{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(0,0,0,.4);transition:width .25s linear}
#rush span{position:relative}
#atlasBtn{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 64px);background:var(--panel);border:var(--bw) solid var(--line);border-radius:14px;padding:9px 14px;font-weight:900;box-shadow:var(--shadow)}
#mute{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--btn-ink);border:0;font-size:20px;box-shadow:var(--shadow)}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);text-align:center;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:15px;pointer-events:none;transition:opacity .5s;text-shadow:0 2px 8px rgba(0,0,0,.45);color:#fff;animation:hp 1.6s infinite}
@keyframes hp{50%{opacity:.55}}
#atlas[hidden]{display:none}
#atlas{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:14px}
#atlas .box{width:min(440px,100%);max-height:84vh;overflow:auto;background:var(--panel2);border:var(--bw) solid var(--accent);border-radius:20px;padding:14px;touch-action:pan-y}
#atlas .box *{touch-action:pan-y}
#atlas h2{margin:0;font-size:21px}
#atlas small{color:var(--accent);font-weight:900;letter-spacing:.1em;font-size:10px}
#atlas .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
#atlas .hd button{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--btn-ink);font-size:18px;font-weight:900}
#atlas .note{font-size:12px;opacity:.75;margin-bottom:8px}
#atlas .row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(128,128,128,.14);border:1px solid rgba(128,128,128,.25);border-radius:13px;padding:9px 11px;margin-bottom:6px}
#atlas .row:disabled{opacity:.42}
#atlas .row i{font-style:normal;font-size:22px;width:28px;text-align:center}
#atlas .row span{flex:1;min-width:0}
#atlas .row b{display:block;font-size:14px}
#atlas .row em{font-style:normal;font-size:11px;opacity:.7}
#atlas .row strong{color:var(--gold);white-space:nowrap;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px}
#modal.show{display:grid}
#modal>div{background:var(--panel2);border:var(--bw) solid var(--accent);border-radius:20px;padding:18px;max-width:330px;text-align:center}
#modal p{margin:6px 0 14px;line-height:1.4;font-size:14px}
#modal .b2{display:flex;gap:8px}
#modal button{flex:1;padding:11px;border-radius:12px;border:var(--bw) solid var(--line);background:rgba(128,128,128,.18);font-weight:900}
#modal button.go{background:var(--accent2);color:var(--btn-ink);border:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud">
  <div class="brand"><i id="brandIcon"></i><div><b id="brandT"></b><small id="brandS"></small></div></div>
  <div class="wallet">
    <div class="pill money"><span id="curIcon"></span><b id="money">0</b></div>
    <div class="pill pocket"><span id="pockIcon"></span><b id="carry">0/6</b><em id="mult" class="hidden"></em><button id="menuBtn" aria-label="Menü">☰</button></div>
  </div>
</header>
<div id="quest" class="card"><span class="qi" id="qIcon"></span><div><small>DEIN NÄCHSTER SCHRITT</small><b id="qT"></b><span class="qd" id="qD"></span></div><span class="qdist" id="qDist"></span></div>
<div id="drawer" class="card hidden">

  <p>Rucksack <b id="sCarry"></b></p><p>Tempo <b id="sSpeed"></b></p><p>Verkaufspreis <b id="sPrice"></b></p>
  <p>Helfer <b id="sHelp"></b></p><p>Einkommen <b id="sPass"></b></p><p>Ausbau <b id="sBuild"></b></p>
  <button id="resetBtn">Spielstand zurücksetzen</button>
</div>
<button id="atlasBtn">✧ Wegweiser</button>
<div class="tools"><button id="zin" aria-label="Näher">＋</button><button id="zout" aria-label="Weiter">−</button><button id="rush"><i></i><span>⚡ RUSH</span></button></div>
<button id="mute" aria-label="Ton">🔊</button>
<div id="hint">Zum Laufen ziehen</div>
<div id="atlas" hidden><div class="box"><div class="hd"><div><small id="aCount"></small><h2>Wegweiser</h2></div><button id="aClose">×</button></div><div class="note" id="aNote"></div><div id="aList"></div></div></div>
<div id="modal"><div><div style="font-size:30px" id="mIcon"></div><b>Spielstand zurücksetzen?</b><p>Alle freigeschalteten Bereiche, Helfer und Upgrades werden auf den Anfang zurückgesetzt.</p><div class="b2"><button id="mNo">Abbrechen</button><button id="mYes" class="go">Ja, zurücksetzen</button></div></div></div>

<script>
(()=>{
'use strict';
const T={"slug": "vulkanschmiede", "art": "lava", "title": "Vulkanschmiede · Glühende Werkstatt", "css": {"--bg": "#140a08", "--panel": "rgba(34,16,12,.9)", "--panel2": "#2a120c", "--line": "rgba(255,140,40,.55)", "--accent": "#ff8a2a", "--accent2": "#e8381c", "--gold": "#ffd36a", "--ink": "#fff1e0", "--btn-ink": "#2a0e04", "--font": "'Trebuchet MS','Segoe UI',system-ui,sans-serif", "--radius": "10px", "--bw": "2px", "--shadow": "0 0 16px rgba(255,100,20,.28)"}, "brand": {"icon": "🌋", "title": "Vulkanschmiede", "sub": "GLÜHENDE WERKSTATT", "drawer": "Deine Schmiede"}, "coin": {"icon": "🪙", "name": "Goldmünzen"}, "pocket": "⛏️", "text": {"thanks": "🔥 Prima!", "sell": "LIEFERN", "atlasSub": "Baufelder am Vulkan"}, "market": {"name": "Schmiedetresen", "body": "#5a4638", "top": "#8a6c52", "stripe": "#c0392b", "sign": "#2a1810", "signLine": "#ff8a2a", "signText": "#ffd36a"}, "chest": {"body": "#4a4a56", "trim": "#ffd36a", "lid": "#6a6a78"}, "bench": {"name": "AMBOSS-SCHMIEDE", "emoji": "", "body": "#3a3036", "top": "#6a5a62"}, "trash": "", "ground": {"style": "lava", "top": "#2c1c1c", "mid": "#3a2420", "bot": "#241616", "tile": 4, "tileColor": "rgba(255,255,255,.035)", "border": "#120808", "glow": "rgba(255,120,40,.6)", "outside": ["#2a0f0a", "#080303"], "vignette": "rgba(20,0,0,.62)", "padFill": "rgba(255,200,120,.16)", "padFillActive": "rgba(255,200,120,.3)"}, "deco": {"edge": [], "floor": []}, "ambient": "embers", "items": {"a": {"icon": "⚫", "plural": "Kohle", "node": "", "glow": "#ff6a1a", "bed": ["#3a3236", "#2a2428", "#ff8a2a"]}, "b": {"icon": "🔩", "plural": "Eisenerz", "node": "", "glow": "#ffb066", "bed": ["#4a4650", "#38343e", "#c4682c"]}, "c": {"icon": "🔴", "plural": "Rubine", "node": "", "glow": "#ff3a4a", "bed": ["#4a2a34", "#361a24", "#ff5a6a"]}, "d": {"icon": "🥚", "plural": "Dracheneier", "node": "", "glow": "#ffd36a", "bed": ["#4a3426", "#34241a", "#ffb040"]}, "e": {"icon": "⚔️", "plural": "Schwerter", "node": "", "glow": "#ffffff", "bed": ["#444", "#333", "#999"]}}, "customers": [], "player": {"style": "art"}, "helpers": {"emoji": "", "foreman": "", "gardener": ""}, "pads": {"up_capacity": {"label": "ERZKORB", "icon": "🎒", "name": "Erzkorb (Rucksack)", "msg": "Größerer Erzkorb! 🎒"}, "up_speed": {"label": "STAHLSTIEFEL", "icon": "👢", "name": "Stahlstiefel (Tempo)", "msg": "Schneller laufen! ⚡"}, "up_price": {"label": "PREISE +", "icon": "💰", "name": "Preise", "msg": "Bessere Preise! 💰"}, "up_sell_speed": {"label": "SCHNELL LIEFERN", "icon": "⚡", "name": "Schneller liefern", "msg": "Liefertempo + ⚡"}, "up_helpers": {"label": "SALAMANDER", "icon": "🦎", "name": "Salamander-Helfer", "msg": "Neuer Salamander! 🦎"}, "up_helper_stats": {"label": "SALAMANDER +", "icon": "💪", "name": "Salamander stärken", "msg": "Salamander-Power + 💪"}, "up_tulip_expand": {"label": "KOHLEFLÖZ", "icon": "🪨", "name": "Kohleflöz", "msg": "Kohleflöz wächst! ⛏️"}, "up_beehive": {"label": "EISENMINE", "icon": "⛏️", "name": "Eisenmine", "msg": "Eisenmine! ⛏️"}, "up_orchard": {"label": "RUBINGRUBE", "icon": "💎", "name": "Rubingrube", "msg": "Rubingrube! 💎"}, "up_pumpkin": {"label": "DRACHENNEST", "icon": "🥚", "name": "Drachennest", "msg": "Drachennest! 🥚"}, "up_workbench": {"label": "AMBOSS-SCHMIEDE", "icon": "⚒️", "name": "Amboss-Schmiede", "msg": "Schwerter schmieden! ⚔️"}, "up_vip_stand": {"label": "8 KUNDEN", "icon": "🛡️", "name": "8 Kunden am Tresen", "msg": "8 Kunden an einem Tresen!"}, "up_cashier2": {"label": "SCHMIEDEMEISTER", "icon": "🔨", "name": "Schmiedemeister (Vorarbeiter)", "msg": "Schmiedemeister: clevere Wege + Tempo!"}, "up_fountain": {"label": "GLUT-DRACHE", "icon": "🐲", "name": "Glut-Drache (Wachstum)", "msg": "Der Glut-Drache heizt das Wachstum an!"}, "up_flowers_more": {"label": "KOHLE +", "icon": "🪨", "name": "Kohleflöz erweitern", "msg": "Kohleflöz vergrößert!"}, "up_honey_more": {"label": "ERZ +", "icon": "⛏️", "name": "Eisenmine erweitern", "msg": "Eisenmine vergrößert!"}, "up_apples_more": {"label": "RUBINE +", "icon": "💎", "name": "Rubingrube erweitern", "msg": "Rubingrube vergrößert!"}, "up_pumpkins_more": {"label": "EIER +", "icon": "🥚", "name": "Drachennest erweitern", "msg": "Drachennest vergrößert!"}, "up_boutique_more": {"label": "SCHWERTER +", "icon": "⚔️", "name": "Schmiede verbessern", "msg": "Schmiede verbessert!"}, "up_market2": {"label": "KUNDENPLATZ", "icon": "🧔", "name": "Kundenplatz 5", "msg": "Weiterer Kunde am Tresen!"}, "up_market3": {"label": "KUNDENPLATZ", "icon": "🧔", "name": "Kundenplatz 6", "msg": "Weiterer Kunde am Tresen!"}, "up_market4": {"label": "KUNDENPLATZ", "icon": "🧔", "name": "Kundenplatz 7", "msg": "Weiterer Kunde am Tresen!"}}};
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1,SC=30;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
addEventListener('resize',resize);resize();

/* ===== Werte ===== */
const TY=['a','b','c','d','e'];
const BASE={a:5,b:14,c:28,d:55,e:185};
const REGROW={a:3.6,b:5.2,c:7.5,d:11};
const CARRY=[6,10,16,24,34,46,60,80,105,140,200];
const BX0=-23,BX1=24,BY0=-21,BY1=24;
const KEY='welten_'+T.slug+'_v1';
const FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const fmt=n=>{n=Math.floor(n);if(n<1000)return''+n;if(n<1e6)return(n/1000).toFixed(n>=1e5?0:n>=1e4?1:2).replace(/\.0+$/,'')+'K';if(n<1e9)return(n/1e6).toFixed(2).replace(/\.00$/,'')+'M';return(n/1e9).toFixed(2)+'B';};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const itm=t=>T.items[t];

/* ===== Spielstand ===== */
const DEF={money:25,lvlCapacity:0,lvlSpeed:0,lvlPrice:0,lvlSellSpeed:0,lvlHelperStats:0,
 extraFlowers:0,extraHoney:0,extraOrchard:0,extraPumpkins:0,boutiqueLevel:0,
 tulipBed2:false,tulipBed3:false,beehive1:false,beehive2:false,orchard1:false,orchard2:false,pumpkin1:false,
 workbench:false,vipStand:false,helper1:false,helper2:false,helper3:false,gardener:false,foreman:false,
 market2:false,market3:false,market4:false,padProgress:{},carried:[],cash:0,wbIn:{a:0,b:0,e:0},mute:false};
let S=JSON.parse(JSON.stringify(DEF));
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)S=Object.assign(S,j);}catch(e){}
const R={t:18.5,max:25,on:false,left:0,k:0};
function save(){try{S.carried=P.inv.slice();S.cash=M.cash;S.wbIn={a:WB.a,b:WB.b,e:WB.e};localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const capMax=()=>CARRY[Math.min(S.lvlCapacity,CARRY.length-1)];
const pSpeed=()=>(7.4+S.lvlSpeed*.75)*(R.on?1.35:1);
const sellIv=()=>Math.max(.035,.14*Math.pow(.83,Math.min(8,S.lvlSellSpeed||0)));
const pMult=()=>(1+S.lvlPrice*.35)*(R.on?1.5:1);
const hCap=()=>5+S.lvlHelperStats*4+(S.foreman?4:0);
const hSpeed=()=>(4.8+S.lvlHelperStats*.65)*(S.foreman?1.35:1);
const passive=()=>S.workbench?Math.round(40*pMult()):0;
const value=t=>Math.round(BASE[t]*pMult());

/* ===== Welt ===== */
const P={x:1,y:6.5,inv:[],face:1,moving:false,cd:0};
const M={x:4.6,y0:-.3,qx:6.3,qy:.6,sell:{x:2.7,y:3.2},pad:{x:2.7,y:-.7},cash:0,cd:0};
const WB={x:-3,y:19,inZ:{x:-5.6,y:19},outZ:{x:-.4,y:19},a:0,b:0,e:0,ct:0};
const TRASH={x:12.5,y:14.5,dwell:0,exit:false};
const queueCap=()=>4+['market2','market3','market4','vipStand'].filter(f=>S[f]).length;
const slotPos=i=>({x:M.qx,y:M.qy+i*1.0});

const nodes=[];
const CROPS={
 a:{cx:-8,cy:-4,on:()=>true,dims:()=>{const s=(S.tulipBed3?5:S.tulipBed2?4:3)+Math.min(3,S.extraFlowers||0);return[s,s];}},
 b:{cx:11,cy:-11,on:()=>S.beehive1,dims:()=>{const x=S.beehive2?1:0;return[3+x+Math.min(3,S.extraHoney||0),2+x];}},
 c:{cx:18,cy:2.5,on:()=>S.orchard1,dims:()=>{const x=S.orchard2?1:0;return[3+x+Math.min(3,S.extraOrchard||0),2+x];}},
 d:{cx:-13,cy:12,on:()=>S.pumpkin1,dims:()=>[3+Math.min(3,S.extraPumpkins||0),2+((S.extraPumpkins||0)>=2?1:0)]}
};
const SP=1.4;
function rebuild(type){
  const old=nodes.filter(n=>n.type===type);
  for(let i=nodes.length-1;i>=0;i--)if(nodes[i].type===type)nodes.splice(i,1);
  const c=CROPS[type];if(!c.on())return;
  const[cols,rows]=c.dims();
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const x=c.cx+(i-(cols-1)/2)*SP,y=c.cy+(j-(rows-1)/2)*SP;
    const o=old.find(n=>Math.abs(n.x-x)<.01&&Math.abs(n.y-y)<.01);
    nodes.push({type,x,y,grown:o?o.grown:true,t:o?o.t:0,water:o?o.water:0,ph:Math.random()*6});
  }
}
const rebuildAll=()=>'abcd'.split('').forEach(rebuild);

const cust=[],helpers=[],fl=[],parts=[],pops=[],leavers=[];
for(let i=0;i<3;i++)helpers.push({x:-3+i*.8,y:3.5,inv:[],ai:'harvest',cd:0,face:1,on:false});
const FORE={x:7.5,y:-3,face:-1};
const GARD={x:-1,y:-2,face:1,target:null};
let T0=0,zoom=1,cam={x:P.x,y:P.y};

/* ===== Sound ===== */
let AC=null;
function snd(f,d=.08,type='sine',v=.05){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}}
const fanfare=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.18,'triangle',.06),i*90));};

/* ===== Effekte ===== */
function popup(x,y,text,color,coin){pops.push({x,y,text,color:color||T.css['--gold'],t:0,coin});}

}
function syncQueue(spawn){

function serve(inv,from){

  if(!el)return false;
  inv.splice(inv.indexOf(el.type),1);
  el.need--;
  const reward=value(el.type);
  fly(from,el,el.type,()=>fly(el,M.pad,'cash',()=>{M.cash+=reward;}));
  if(el.need<=0){
    el.leaving=true;el.t=0;burst(el.x,el.y,T.css['--accent2'],10);popup(el.x,el.y-1,T.text.thanks||'❤️ Danke!','#ff7aa8');

const PHW=1.35,PHH=.95;

function deposit(dt){
  const f=atlasOpen?null:PADS.find(p=>padOpen(p)&&inField(P,p));
  if(f!==active){if(transferred)save();active=f;depT=0;transferred=false;}
  if(!f){for(const p of PADS)if(p.exit&&!inField(P,p))p.exit=false;return;}

let walk=0;
function update(dt){
  T0+=dt;walk+=dt;
  // Rush
  if(R.on){R.left-=dt;if(R.left<=0){R.on=false;R.left=0;}}else R.t=Math.min(R.max,R.t+dt);
  // Bewegung
  let ix=0,iy=0;
  if(keys.arrowleft||keys.a)ix--;if(keys.arrowright||keys.d)ix++;if(keys.arrowup||keys.w)iy--;if(keys.arrowdown||keys.s)iy++;
  if(joy.on&&!atlasOpen){ix=joy.vx;iy=joy.vy;}
  if(atlasOpen){ix=iy=0;}
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
  P.x=clamp(P.x+ix*pSpeed()*dt,BX0+.8,BX1-.8);P.y=clamp(P.y+iy*pSpeed()*dt,BY0+1,BY1-.6);
  // Tresen als Hindernis
  const cl=queueCap()*1.0+.6;
  if(P.x>M.x-.5&&P.x<M.x+.9&&P.y>M.y0-.3&&P.y<M.y0+cl){P.x=P.x<M.x+.2?M.x-.5:M.x+.9;}
  P.moving=m>.12;if(Math.abs(ix)>.1)P.face=ix>0?1:-1;
  if(P.moving)$('hint').style.opacity=0;
  // Wachstum
  for(const n of nodes){
    if(n.grown)continue;
    n.t+=dt*(n.water>0?2.7:1);if(n.water>0)n.water-=dt;
    if(n.t>=REGROW[n.type]){n.grown=true;n.t=0;n.pop=.25;}
  }
  for(const n of nodes)if(n.pop>0)n.pop-=dt;
  // Ernte
  P.cd=Math.max(0,P.cd-dt);
  if(P.inv.length<capMax()&&P.cd<=0){
    for(const n of nodes){
      if(!n.grown)continue;
      if(Math.hypot(P.x-n.x,P.y-n.y)<1.45){
        n.grown=false;n.t=0;P.cd=Math.max(.045,.11-S.lvlSpeed*.008);
        snd(460+(P.inv.length%12)*32,.05);
        const ty=n.type;fly({x:n.x,y:n.y},P,ty,()=>{if(P.inv.length<capMax())P.inv.push(ty);},.3);
        break;
      }
    }
  }
  // Werkbank
  if(S.workbench){
    if(dist(P,WB.inZ)<1.55&&P.inv.length>0&&P.cd<=0){
      const i=P.inv.findIndex(t=>t==='a'||t==='b');
      if(i>=0){const t=P.inv.splice(i,1)[0];fly({x:P.x,y:P.y-.5},WB.inZ,t,()=>{WB[t]++;},.3);P.cd=.12;snd(520,.05);}
    }
    WB.ct+=(WB.a>0&&WB.b>0)?dt:0;
    if(WB.a>0&&WB.b>0&&WB.ct>=Math.max(.24,.7-(S.boutiqueLevel||0)*.09)){WB.ct=0;WB.a--;WB.b--;WB.e+=1+Math.floor((S.boutiqueLevel||0)/2);burst(WB.x,WB.y-.5,T.css['--gold'],8);snd(880,.08,'triangle');}
    if(WB.a<=0||WB.b<=0)WB.ct=0;
    if(dist(P,WB.outZ)<1.55&&WB.e>0&&P.inv.length<capMax()&&P.cd<=0){WB.e--;fly(WB.outZ,P,'e',()=>{if(P.inv.length<capMax())P.inv.push('e');},.3);P.cd=.12;snd(700,.05);}
  }
  // Mülleimer
  if(dist(P,TRASH)>1.6){TRASH.dwell=0;TRASH.exit=false;}
  else if(!TRASH.exit&&P.inv.length>0&&m<.12){TRASH.dwell+=dt;if(TRASH.dwell>=.7){const n=P.inv.length;P.inv.length=0;TRASH.dwell=0;TRASH.exit=true;popup(TRASH.x,TRASH.y-1.4,'🗑️ −'+n);burst(TRASH.x,TRASH.y,'#9ad',10);snd(220,.15,'triangle');}}
  else TRASH.dwell=0;
  // Verkauf
  M.cd-=dt;
  if(dist(P,M.sell)<1.85&&P.inv.length>0&&M.cd<=0){if(serve(P.inv,{x:P.x,y:P.y-.6})){M.cd=sellIv();snd(600+Math.random()*200,.05);}}
  // Kasse
  if(dist(P,M.pad)<1.75&&M.cash>0){const c=M.cash;M.cash=0;S.money+=c;burst(M.pad.x,M.pad.y,T.css['--gold'],12);popup(M.pad.x,M.pad.y-1.3,'+'+fmt(c),null,true);snd(990,.1,'triangle');save();}
  deposit(dt);
  // Passiv
  const pr=passive();if(pr>0){M.pt=(M.pt||0)+dt;if(M.pt>=1){M.pt-=1;S.money+=pr;}}
  // Helfer
  helpers.forEach((h,i)=>{if(h.on){h.mv=false;helperAI(h,i,dt);}});GARD.mv=false;
  if(S.gardener)gardenAI(dt);
  // Kunden
  for(let i=cust.length-1;i>=0;i--){
    const c=cust[i];
    if(c.leaving){c.t+=dt;c.x+=1.2*dt;c.y+=2.2*dt;if(c.t>1.15)cust.splice(i,1);}
    else{const s=slotPos(c.idx),dx=s.x-c.x,dy=s.y-c.y,d=Math.hypot(dx,dy);c.mv=d>.08;if(d>.08){const sp=Math.min(d,3.8*dt);c.x+=dx/d*sp;c.y+=dy/d*sp;}}
  }
  // Flug & Partikel
  for(let i=fl.length-1;i>=0;i--){const f=fl[i];f.t+=dt;if(f.t>=f.d){fl.splice(i,1);if(f.cb)f.cb();}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.vy+=9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.l)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>1.3)pops.splice(i,1);}
  // Sichern
  M.sv=(M.sv||0)+dt;if(M.sv>3){M.sv=0;save();}
}
function moveTo(o,x,y,sp,dt){const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy);if(d>.001){o.mv=true;const s=Math.min(d,sp*dt);o.x+=dx/d*s;o.y+=dy/d*s;if(Math.abs(dx)>.02)o.face=dx>0?1:-1;}return d;}
function helperAI(h,idx,dt){
  const sp=hSpeed(),mx=hCap();h.cd=Math.max(0,h.cd-dt);
  const live=cust.filter(c=>!c.leaving);
  if(h.ai==='harvest'){
    const needed=live.some(c=>h.inv.includes(c.type));
    if(h.inv.length>=mx||(needed&&h.inv.length>=Math.min(3,mx))){h.ai='deliver';return;}
    const wanted=live.slice().sort((a,b)=>a.idx-b.idx).flatMap(c=>Array(Math.min(c.need,mx)).fill(c.type));
    let best=null,bs=1e9;
    for(const n of nodes){
      if(!n.grown)continue;
      const d=Math.hypot(h.x-n.x,h.y-n.y),first=wanted.indexOf(n.type),stock=h.inv.filter(t=>t===n.type).length,out=wanted.filter(t=>t===n.type).length-stock;
      const sc=d*(S.foreman?.58:1)+(out>0?(S.foreman?-34:-18)+Math.max(0,first)*1.5:28)+idx*1.5;
      if(sc<bs){bs=sc;best=n;}
    }
    if(best){
      const d=Math.hypot(best.x-h.x,best.y-h.y);
      if(d>.95)moveTo(h,best.x,best.y,sp,dt);
      else{best.grown=false;best.t=0;h.inv.push(best.type);}
    }else if(h.inv.length>0)h.ai='deliver';
  }else{
    if(!live.some(c=>h.inv.includes(c.type))){h.ai='harvest';return;}
    const tx=M.sell.x-.3,ty=M.sell.y-.35+idx*.3;
    if(Math.hypot(tx-h.x,ty-h.y)>.65)moveTo(h,tx,ty,sp,dt);
    else{
      if(h.cd<=0&&serve(h.inv,{x:h.x,y:h.y-.6}))h.cd=sellIv();
      if(h.inv.length===0||!cust.some(c=>!c.leaving&&h.inv.includes(c.type)))h.ai='harvest';
    }
  }
}
function gardenAI(dt){
  if(!GARD.target||GARD.target.grown||GARD.target.water>0){
    let b=null,bd=1e9;for(const n of nodes){if(n.grown||n.water>0)continue;const d=Math.hypot(GARD.x-n.x,GARD.y-n.y);if(d<bd){bd=d;b=n;}}

/* ===== Ziel / Quest ===== */
let objT=0,target=null;
function objective(dt){
  objT-=dt;if(objT>0)return;objT=.25;
  const live=cust.filter(c=>!c.leaving);
  const w=live.find(c=>P.inv.includes(c.type))||live[0];
  const it=w?w.type:'a';
  let title='Sammle '+itm(it).plural,detail='Folge der Markierung.',icon=itm(it).icon;
  const nd=nodes.find(n=>n.type===it&&n.grown)||nodes.find(n=>n.type===it);
  target=nd?{x:nd.x,y:nd.y}:WB.outZ;
  const rec=PADS.find(p=>p.id===(!S.tulipBed2?'up_tulip_expand':!S.beehive1?'up_beehive':'up_capacity')&&padOpen(p));
  const dest=tracked||rec;
  if(active){title=active.name;detail=active.exit?'Fertig! Verlasse das Baufeld.':S.money<1?'Weitere '+T.coin.name+' an der Kasse abholen.':'Stehen bleiben · noch '+fmt(active.rem)+' '+T.coin.name;target=active;icon='◈';}
  else if(tracked&&padOpen(tracked)){title='Zum Baufeld: '+tracked.name;detail='Noch '+fmt(tracked.rem)+' '+T.coin.name+' · Teilzahlungen möglich.';target=tracked;icon='◇';}
  else if(M.cash>0){title=T.coin.name+' an der Kasse abholen';detail='Trage den Erlös zu einem Baufeld.';target=M.pad;icon=T.coin.icon;}
  else if(P.inv.includes(it)||P.inv.length>=capMax()){title='Ernte verkaufen';detail='Gehe zum Verkaufsfeld am '+T.market.name+'.';target=M.sell;icon=itm(it).icon;}
  else if(dest&&S.money>0&&(S.money>=dest.rem||dest.total!==dest.rem)){title='Zum Baufeld: '+dest.name;detail='Zum Einzahlen auf dem Feld stehen bleiben.';target=dest;icon='◇';}
  $('qT').textContent=title;$('qD').textContent=detail;$('qIcon').textContent=icon;
  const d=Math.hypot(target.x-P.x,target.y-P.y);$('qDist').textContent=Math.round(d)+' m';
}

function drawMarket(){

function drawPad(p){
  if(!padOpen(p))return;
  const pu=.5+.5*Math.sin(T0*3),act=(active===p);
  ctx.save();
  rr(p.x-PHW,p.y-PHH,PHW*2,PHH*2,.4);ctx.fillStyle=act?(G.padFillActive||'rgba(255,255,255,.34)'):(G.padFill||'rgba(255,255,255,.2)');ctx.fill();
  const f=1-p.rem/p.total;
  if(f>0){ctx.save();rr(p.x-PHW,p.y-PHH,PHW*2,PHH*2,.4);ctx.clip();ctx.fillStyle=T.css['--gold'];ctx.globalAlpha=.4;ctx.fillRect(p.x-PHW,p.y+PHH-PHH*2*f,PHW*2,PHH*2*f);ctx.restore();}
  rr(p.x-PHW,p.y-PHH,PHW*2,PHH*2,.4);ctx.setLineDash([.5,.35]);ctx.lineDashOffset=-T0*1.4;ctx.lineWidth=.14;ctx.strokeStyle=p.exit?'#7e8':T.css['--accent'];ctx.globalAlpha=.7+pu*.3;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  ctx.restore();
  if(p.spr)spr(SPR.item[p.spr],p.x-.7,p.y-.1,.8);else em(p.icon,p.x-.7,p.y-.15,.95);
  txt(p.label,p.x+.35,p.y-.55,.27,{c:'#fff',s:'rgba(0,0,0,.55)',sw:3.5,w:'900'});
  txt(p.tag(),p.x+.35,p.y-.15,.24,{c:'#ffeaa0',s:'rgba(0,0,0,.5)',sw:3});
  if(p.exit)txt('✔',p.x+.35,p.y+.4,.4,{c:'#fff',s:'rgba(0,0,0,.6)',sw:4,w:'900'});else{const t=fmt(p.rem);ctx.save();ctx.font='900 '+(.4*SC)+'px '+T.css['--font'];const tw=ctx.measureText(t).width/SC;ctx.restore();txt(t,p.x+.1-.2+(.0),p.y+.4,.4,{c:'#fff',s:'rgba(0,0,0,.6)',sw:4,w:'900'});spr(SPR.coin,p.x+.1+tw/2+.25,p.y+.4,.38);}
}
function drawStack(inv,x,y){
  const n=Math.min(inv.length,14);
  for(let i=0;i<n;i++)icon(inv[inv.length-1-(n-1-i)],x+Math.sin(T0*3+i)*.04,y-i*.3,.5);
}

function drawPlayer(){
  if(T.player.halo){ctx.fillStyle=T.player.halo;ctx.beginPath();ctx.arc(P.x,P.y+.1,.9,0,7);ctx.fill();}
  shadow(P.x,P.y+.72,.5,.17);
  ctx.save();ctx.translate(P.x,P.y);ctx.scale(P.face,1);ART.player(ctx,{walk,moving:P.moving,face:P.face});ctx.restore();

  const full=P.inv.length>=capMax();
  bubble(full?'VOLL':P.inv.length+'/'+capMax(),P.x,P.y-1.95-Math.min(P.inv.length,14)*.3,full?T.css['--accent2']:'rgba(0,0,0,.65)','#fff',.34);
}
function drawHelper(h,i){
  const sw=h.mv?Math.sin(walk*12+i):Math.sin(walk*2+i)*.3,hop=h.mv?Math.abs(sw)*.1:0;
  shadow(h.x,h.y+.5,.42,.14);
  spr(SPR.helper,h.x,h.y-.15-hop,.78,false,sw*.06);
  drawStack(h.inv,h.x,h.y-1.0);
}
function drawCust(c){
  const a=c.leaving?Math.max(0,1-c.t/1.15):1,w=walk*9+c.ph,mv=c.mv||c.leaving;
  const hop=mv?Math.abs(Math.sin(w))*.14:0,sq=1+(mv?Math.sin(w*2)*.035:Math.sin(walk*2.4+c.ph)*.02);
  shadow(c.x,c.y+.62,.46,.15,.2*a);

  ctx.save();ctx.globalAlpha=a;ctx.translate(c.x,c.y-.2-hop);ctx.rotate(mv?Math.sin(w)*.05:0);ctx.scale((flip?-1:1)*sq,1/sq);
  const sp=SPR.cust[c.k%SPR.cust.length],s=sp.S*.7;ctx.drawImage(sp,-s/2,-s/2,s,s);ctx.restore();
  if(!c.leaving&&c.need>0)pillIcon(SPR.item[c.type],''+c.need,c.x+1.25,c.y-.05,.34,'#fff','#222');

function drawGuide(){
  if(!target)return;
  const dx=target.x-P.x,dy=target.y-P.y,d=Math.hypot(dx,dy),pu=Math.sin(T0*5)*.1;
  ctx.strokeStyle=T.css['--gold'];ctx.lineWidth=.1;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(target.x,target.y,.75+pu,0,7);ctx.stroke();ctx.globalAlpha=1;
  if(d>2.8){const a=Math.atan2(dy,dx);ctx.save();ctx.translate(P.x+Math.cos(a)*2.3,P.y-.4+Math.sin(a)*2.3);ctx.rotate(a);
    ctx.fillStyle=T.css['--gold'];ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=.07;ctx.beginPath();ctx.moveTo(.5,0);ctx.lineTo(-.3,-.4);ctx.lineTo(-.1,0);ctx.lineTo(-.3,.4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
}
function drawFx(){
  for(const f of fl){
    const k=f.t/f.d,e=k*k*(3-2*k),b=f.b;
    const x=f.a.x+(b.x-f.a.x)*e,y=f.a.y+((b.y-(b.cy||0))-f.a.y)*e-Math.sin(k*Math.PI)*1.3;
    icon(f.icon,x,y,.55*(.75+Math.sin(k*Math.PI)*.3));
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,.1,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.min(1,(1.3-p.t)*1.5);txt(p.text,p.x,p.y-p.t*1.3,.5,{c:p.color,s:'rgba(0,0,0,.65)',sw:5,w:'900'});}

}
function draw(){
  const base=Math.max(24,Math.min(W,H)/12.5);SC=base*zoom;
  cam.x+=(P.x-cam.x)*.14;cam.y+=(P.y-cam.y)*.14;
  const vw=W/SC,vh=H/SC,ww=BX1-BX0,wh=BY1-BY0;
  const cx=vw>=ww+3?(BX0+BX1)/2:clamp(cam.x,BX0+vw/2-1.5,BX1-vw/2+1.5);
  const cy=vh>=wh+3?(BY0+BY1)/2:clamp(cam.y,BY0+vh/2-1.5,BY1-vh/2+1.5);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const o=ctx.createLinearGradient(0,0,0,H);o.addColorStop(0,G.outside[0]);o.addColorStop(1,G.outside[1]);ctx.fillStyle=o;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(W/2-cx*SC),DPR*(H/2-cy*SC));

  drawMarket();drawWorkbench();drawTrash();
  for(const n of nodes)drawNode(n);
  const L=[];
  cust.forEach(c=>L.push([c.y,()=>drawCust(c)]));
  helpers.forEach((h,i)=>{if(h.on)L.push([h.y,()=>drawHelper(h,i)]);});
  if(S.foreman)L.push([FORE.y,()=>{shadow(FORE.x,FORE.y+.6,.5,.16);spr(SPR.foreman,FORE.x,FORE.y-.2,.72,false,Math.sin(walk*2)*.02);}]);
  if(S.gardener)L.push([GARD.y,()=>{const fl=ART.leftFacing.gardener?GARD.face>0:false,bob=Math.sin(walk*(GARD.mv?10:3))*(GARD.mv?.07:.05);shadow(GARD.x,GARD.y+.6,.5,.16);spr(SPR.gardener,GARD.x,GARD.y-.15+bob,.82,fl);}]);
  L.push([P.y,drawPlayer]);
  L.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
  drawGuide();drawFx();
  // Screen-Space
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(T.ambient==='bubbles'){
    for(let k=0;k<5;k++){const x=(k*.27+.1)*W+Math.sin(T0*.3+k)*30,gr=ctx.createLinearGradient(x,0,x+80,H*.8);gr.addColorStop(0,'rgba(190,255,245,.08)');gr.addColorStop(1,'rgba(190,255,245,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+60,0);ctx.lineTo(x+200,H*.8);ctx.lineTo(x+90,H*.8);ctx.fill();}
    ctx.fillStyle='rgba(200,255,250,.22)';
    for(const b of amb){b.y-=b.s*.016;if(b.y<-.05){b.y=1.05;b.x=Math.random();}ctx.beginPath();ctx.arc((b.x+Math.sin(T0+b.p)*.012)*W,b.y*H,b.r,0,7);ctx.fill();}
  }else if(T.ambient==='embers'){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const b of amb){b.y-=b.s*.03;b.x+=Math.sin(T0*1.3+b.p)*.0008;if(b.y<-.05){b.y=1.05;b.x=Math.random();}const fl=.5+.5*Math.sin(T0*6+b.p*3);ctx.globalAlpha=.35+fl*.4;ctx.fillStyle=b.c%3?'#ff8a2a':'#ffd36a';ctx.beginPath();ctx.arc(b.x*W,b.y*H,b.r*.55,0,7);ctx.fill();}
    ctx.restore();ctx.globalAlpha=1;
  }else if(T.ambient==='sprinkles'){
    const cols=T.sprinkles;
    for(const b of amb){b.y+=b.s*.016;b.x+=Math.sin(T0*.7+b.p)*.0004;if(b.y>1.05){b.y=-.05;b.x=Math.random();}ctx.save();ctx.translate(b.x*W,b.y*H);ctx.rotate(T0*.8+b.p);ctx.fillStyle=cols[b.c%cols.length];ctx.globalAlpha=.75;rr(-b.r*1.4,-b.r*.5,b.r*2.8,b.r,b.r*.5);ctx.fill();ctx.restore();}
    ctx.globalAlpha=1;
  }
  if(G.vignette){const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,10,20,0)');v.addColorStop(1,G.vignette);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
  if(joy.on){ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(joy.ox,joy.oy,JR,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(joy.x,joy.y,22,0,7);ctx.fill();}
  if(R.on){ctx.strokeStyle='rgba(255,200,60,'+(.28+.15*Math.sin(T0*10))+')';ctx.lineWidth=9;ctx.strokeRect(0,0,W,H);}
}

/* ===== HUD ===== */
let lastM=-1,lastC='';
function hud(){
  const m=Math.floor(S.money);if(m!==lastM){lastM=m;$('money').textContent=fmt(m);}
  const c=P.inv.length+'/'+capMax();if(c!==lastC){lastC=c;$('carry').textContent=c;}
  const mu=pMult();$('mult').classList.toggle('hidden',mu<=1.001);$('mult').textContent='×'+mu.toFixed(2);
  const r=$('rush');r.querySelector('i').style.width=(R.on?R.left/12*100:100-R.t/R.max*100)+'%';
  r.querySelector('span').textContent=R.on?'⚡ '+Math.ceil(R.left)+'s':R.t>=R.max?'⚡ RUSH':'⚡ '+Math.ceil(R.max-R.t)+'s';
  if(!$('drawer').classList.contains('hidden')){
    const total=PADS.reduce((a,p)=>a+(p.maxed()?1:0),0);
    $('sCarry').textContent=capMax();$('sSpeed').textContent=pSpeed().toFixed(1);$('sPrice').textContent='×'+pMult().toFixed(2);
    $('sHelp').textContent=((S.helper1?1:0)+(S.helper2?1:0)+(S.helper3?1:0))+'/3'+(S.foreman?' + Vorarbeiter':'')+(S.gardener?' + Gärtner':'');
    $('sPass').textContent=passive()+' / s';$('sBuild').textContent=total+'/'+PADS.length;
    const pc=Math.round(total/PADS.length*100);$('pct').textContent=pc+'%';$('pctBar').style.width=pc+'%';
  }
}

/* ===== Start ===== */
function init(){
  const root=document.documentElement.style;for(const k in T.css)root.setProperty(k,T.css[k]);
  document.title=T.title;
  $('brandIcon').textContent=T.brand.icon;$('brandT').textContent=T.brand.title;$('brandS').textContent=T.brand.sub;
  $('curIcon').textContent=T.coin.icon;$('pockIcon').textContent=T.pocket;$('drawT').textContent=T.brand.drawer;$('mIcon').textContent=T.brand.icon;
  $('mute').textContent=S.mute?'🔇':'🔊';
  buildSprites();
  defPads();
  const PS={up_tulip_expand:'a',up_beehive:'b',up_orchard:'c',up_pumpkin:'d',up_workbench:'e',up_flowers_more:'a',up_honey_more:'b',up_apples_more:'c',up_pumpkins_more:'d',up_boutique_more:'e'};PADS.forEach(p=>{if(PS[p.id])p.spr=PS[p.id];});
  if(S.helper1)helpers[0].on=true;if(S.helper2)helpers[1].on=true;if(S.helper3)helpers[2].on=true;
  helpers.forEach(h=>{if(h.on){h.x=-3+Math.random()*4;h.y=3+Math.random()*2;}});
  rebuildAll();
  M.cash=S.cash||0;WB.a=S.wbIn.a||0;WB.b=S.wbIn.b||0;WB.e=S.wbIn.e||0;
  P.inv=(S.carried||[]).filter(t=>TY.includes(t)).slice(0,capMax());
  syncQueue(false);
  window.__w={SPR,S,P,M,PADS,nodes,cust,helpers,WB,update,draw,R,rebuildAll,syncQueue,setZoom:z=>{zoom=z;},dbg:()=>({tier:tier(),cap:queueCap()})};
}
init();
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);objective(dt);draw();hud();requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!resetting)save();});
addEventListener('pagehide',()=>{if(!resetting)save();});
requestAnimationFrame(loop);
})();
