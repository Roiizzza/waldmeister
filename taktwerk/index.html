<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e2925"><title>Taktwerk · Montagelinie</title><link rel="stylesheet" href="style.css?v=2"></head><body><main>
<div id="view" aria-label="Montagehalle in 3D"></div><div class="shade"></div>
<header><strong class="brand"><i></i>TAKTWERK</strong><nav><button id="live" class="sel">Montage</button><button id="build">Ausbau</button></nav><div class="money"><span>€</span><b id="cash">0 €</b></div><button id="settings" aria-label="Spielhilfe">?</button></header>
<section id="card"><div class="kicker"><i></i><span id="num">STATION 01 / 04</span></div><h1 id="station">Motorenbau</h1><div class="meta"><i></i><span id="mode">Handbetrieb</span><span>·</span><span id="order"></span></div><ol id="steps"></ol><div class="telemetry"><span id="buffer"></span><b id="output"></b></div></section>
<div id="targets" aria-label="Arbeitspunkte am Werkstück"></div><div id="notice" role="status"></div>
<section class="worktip"><div class="meterLabel"><span id="part"></span><b id="toolState"></b></div><strong id="hint"></strong><div class="meter"><i id="meterFill"></i><i id="zone"></i><b id="needle"></b></div><button id="jump" hidden></button></section>
<footer><div class="hints"><kbd>W A S D</kbd> Bewegen <b>·</b> Ziehen zum Umsehen</div><button id="line"><i></i>Bandübersicht <strong id="count">1 / 4</strong></button></footer><div id="stick"><i></i></div>
<div id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="title"><div class="sheetTop"><div><div class="kicker"><i></i>TAKTWERK</div><h2 id="title">Stationsausbau</h2></div><button id="close" aria-label="Schließen">×</button></div><div id="content"></div></section></div>
</main><script type="module" src="game.js?v=2"></script></body></html>
